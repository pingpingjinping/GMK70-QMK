name: Build GMK70 Vial test

on:
  push:
    branches:
      - vial-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:16c4916e95b99bf88d27b15aec8db409ee17265d1710287fde248c6666508966

    steps:
      - name: Checkout GMK70 overlay
        uses: actions/checkout@v4

      - name: Checkout Vial + Westberry wireless base
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/gskycraig/VIAL_QMK.git /tmp/vial-qmk
          git config --global --add safe.directory /tmp/vial-qmk

      - name: Overlay GMK70
        shell: bash
        run: |
          mkdir -p /tmp/vial-qmk/keyboards/leo/zuoya_gmk70
          rsync -a --delete             --exclude='.git'             --exclude='.github'             ./ /tmp/vial-qmk/keyboards/leo/zuoya_gmk70/

      - name: Build
        shell: bash
        run: |
          cd /tmp/vial-qmk
          qmk compile -kb leo/zuoya_gmk70 -km vial

      - name: Collect firmware
        if: success()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find /tmp/vial-qmk -maxdepth 2 -type f \( -name '*zuoya*gmk70*.bin' -o -name '*zuoya*gmk70*.hex' -o -name '*zuoya*gmk70*.uf2' \) -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GMK70-Vial-test
          path: dist/
          if-no-files-found: error
